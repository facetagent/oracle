databaseChangeLog:

  - changeSet:
      id: 001-create-table-customer
      author: jean.daher
      changes:
        - sqlFile:
            path: ../src/table/customer.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - dropTable:
            tableName: CUSTOMER

  - changeSet:
      id: 002-create-package-pkg-customer-spec
      author: jean.daher
      runOnChange: true
      changes:
        - sqlFile:
            path: ../src/packages/pkg_customer.pks
            relativeToChangelogFile: true
            splitStatements: false
            endDelimiter: /

  - changeSet:
      id: 003-create-package-pkg-customer-body
      author: jean.daher
      runOnChange: true
      changes:
        - sqlFile:
            path: ../src/packages/pkg_customer.pkb
            relativeToChangelogFile: true
            splitStatements: false
            endDelimiter: /
      rollback:
        - sql:
            sql: DROP PACKAGE pkg_customer;

  - changeSet:
      id: 004-insert-customer-data
      author: jean.daher
      changes:
        - loadData:
            tableName: CUSTOMER
            file: data/customer.csv
            relativeToChangelogFile: true
            separator: ","
            columns:
              - column:
                  name: NAME
                  type: STRING
              - column:
                  name: EMAIL
                  type: STRING
      rollback:
        - sql:
            sql: DELETE FROM CUSTOMER WHERE EMAIL IN ('alice.dupont@example.com', 'bruno.martin@example.com', 'claire.bernard@example.com')
