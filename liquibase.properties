## Liquibase configuration for the dbapp Oracle project
## Usage: liquibase update  (from the project root, with this file present)

changeLogFile: changelog/db.changelog-master.yaml

## Connection URL, username and password are NOT stored here - set them as
## environment variables before running liquibase (see README.md):
##   LIQUIBASE_COMMAND_URL
##   LIQUIBASE_COMMAND_USERNAME
##   LIQUIBASE_COMMAND_PASSWORD

driver: oracle.jdbc.OracleDriver

## Point this at your local ojdbc jar (e.g. ojdbc11.jar) if it is not already on the classpath
# classpath: lib/ojdbc11.jar

logLevel: info
